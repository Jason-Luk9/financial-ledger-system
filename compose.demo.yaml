name: ledger-history-demo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger_demo
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  demo-data:
