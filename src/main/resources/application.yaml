spring:
  application:
    name: ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
ledger:
  fx:
    usd-to-sgd: ${USD_TO_SGD:1.25}
    sgd-to-usd: ${SGD_TO_USD:0.80}
springdoc:
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
